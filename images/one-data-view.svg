<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>One Kibana data view across three Dapr data streams</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .lbl   { fill: #5F5E5A; }
  .gray  { fill: #F1EFE8; stroke: #5F5E5A; } .gray-t  { fill: #2C2C2A; } .gray-s  { fill: #5F5E5A; }
  .teal  { fill: #E1F5EE; stroke: #0F6E56; } .teal-t  { fill: #04342C; }
  .purp  { fill: #EEEDFE; stroke: #534AB7; } .purp-t  { fill: #26215C; }
  .cor   { fill: #FAECE7; stroke: #993C1D; } .cor-t   { fill: #4A1B0C; }
  .blue  { fill: #E6F1FB; stroke: #185FA5; } .blue-t  { fill: #042C53; } .blue-s { fill: #185FA5; }
  .arr   { stroke: #888780; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .lbl   { fill: #B4B2A9; }
    .gray  { fill: #444441; stroke: #B4B2A9; } .gray-t  { fill: #D3D1C7; } .gray-s  { fill: #B4B2A9; }
    .teal  { fill: #085041; stroke: #9FE1CB; } .teal-t  { fill: #9FE1CB; }
    .purp  { fill: #3C3489; stroke: #CECBF6; } .purp-t  { fill: #CECBF6; }
    .cor   { fill: #712B13; stroke: #F5C4B3; } .cor-t   { fill: #F5C4B3; }
    .blue  { fill: #0C447C; stroke: #B5D4F4; } .blue-t  { fill: #B5D4F4; } .blue-s { fill: #85B7EB; }
    .arr   { stroke: #888780; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="ts lbl" x="40" y="34">What Dapr sends</text>

<rect class="gray" x="40" y="48" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-t" x="125" y="70" text-anchor="middle" dominant-baseline="central">Logs</text>
<text class="ts gray-s" x="125" y="88" text-anchor="middle" dominant-baseline="central">via the log shipper</text>

<rect class="gray" x="255" y="48" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-t" x="340" y="70" text-anchor="middle" dominant-baseline="central">Traces</text>
<text class="ts gray-s" x="340" y="88" text-anchor="middle" dominant-baseline="central">via the collector</text>

<rect class="gray" x="470" y="48" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-t" x="555" y="70" text-anchor="middle" dominant-baseline="central">Metrics</text>
<text class="ts gray-s" x="555" y="88" text-anchor="middle" dominant-baseline="central">via the collector</text>

<line class="arr" x1="125" y1="104" x2="125" y2="138" marker-end="url(#a)"/>
<line class="arr" x1="340" y1="104" x2="340" y2="138" marker-end="url(#a)"/>
<line class="arr" x1="555" y1="104" x2="555" y2="138" marker-end="url(#a)"/>

<text class="ts lbl" x="40" y="166">Three separate data streams</text>

<rect class="teal" x="40" y="180" width="170" height="44" rx="8" stroke-width="0.5"/>
<text class="t teal-t" x="125" y="202" text-anchor="middle" dominant-baseline="central">logs-*</text>

<rect class="purp" x="255" y="180" width="170" height="44" rx="8" stroke-width="0.5"/>
<text class="t purp-t" x="340" y="202" text-anchor="middle" dominant-baseline="central">traces-*</text>

<rect class="cor" x="470" y="180" width="170" height="44" rx="8" stroke-width="0.5"/>
<text class="t cor-t" x="555" y="202" text-anchor="middle" dominant-baseline="central">metrics-*</text>

<line class="arr" x1="125" y1="224" x2="125" y2="280" marker-end="url(#a)"/>
<line class="arr" x1="340" y1="224" x2="340" y2="280" marker-end="url(#a)"/>
<line class="arr" x1="555" y1="224" x2="555" y2="280" marker-end="url(#a)"/>

<rect class="blue" x="40" y="284" width="600" height="76" rx="12" stroke-width="0.5"/>
<text class="th blue-t" x="340" y="312" text-anchor="middle" dominant-baseline="central">One Kibana data view</text>
<text class="ts blue-s" x="340" y="336" text-anchor="middle" dominant-baseline="central">logs-*,traces-*,metrics-*</text>
</svg>
