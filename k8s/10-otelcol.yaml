# Collector as an ordinary Deployment, not a DaemonSet.
# Traces arrive over OTLP because daprd pushes them. Metrics are scraped from
# the daprd metrics endpoint inside the cluster. Neither needs node access,
# which is the point when the application team does not own the nodes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-cfg
  namespace: default
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
      prometheus:
        config:
          scrape_configs:
            - job_name: daprd
              scrape_interval: 10s
              static_configs:
                - targets: ['logtest-dapr.default.svc.cluster.local:9090']
    processors:
      # Required. Dapr emits cumulative temporality histograms and the
      # Elasticsearch exporter drops every one of them with
      # "dropping cumulative temporality histogram ...", which silently
      # removes dapr_http_server_latency and the rest of the latency metrics.
      cumulativetodelta: {}
    exporters:
      elasticsearch:
        endpoints: ["http://host.minikube.internal:9200"]
        mapping: {mode: otel}
        flush: {interval: 2s}
    service:
      telemetry:
        logs: {level: info}
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [elasticsearch]
        metrics:
          receivers: [prometheus]
          processors: [cumulativetodelta]
          exporters: [elasticsearch]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: otelcol}
  template:
    metadata:
      labels: {app: otelcol}
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/etc/otelcol/config.yaml"]
          volumeMounts:
            - {name: cfg, mountPath: /etc/otelcol}
      volumes:
        - name: cfg
          configMap: {name: otelcol-cfg}
---
apiVersion: v1
kind: Service
metadata:
  name: otelcol
  namespace: default
spec:
  selector: {app: otelcol}
  ports:
    - {name: grpc, port: 4317, targetPort: 4317}
    - {name: http, port: 4318, targetPort: 4318}
