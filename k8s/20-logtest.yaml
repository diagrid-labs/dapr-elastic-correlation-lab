# App plus daprd plus a traffic driver.
#
# The driver has to live in this pod. daprd binds its HTTP API to
# [::1],127.0.0.1 by default, so a curl from any other pod cannot reach it.
# A separate driver Deployment looks correct and silently produces no traffic.
#
# The requests are deliberately a mix of success and failure so the access log
# carries more than one status code and the dashboard panels have something to
# show. A fixed traceparent keeps every span on one trace, which makes the
# correlation easy to eyeball. Drop it for realistic trace cardinality.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logtest
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: logtest}
  template:
    metadata:
      labels: {app: logtest}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "logtest"
        dapr.io/app-port: "8080"
        dapr.io/config: "tracingcfg"
        # API logging is Dapr's access log. Without it there are no
        # "HTTP API Called" lines and nothing to correlate against a span.
        dapr.io/enable-api-logging: "true"
        # Sidecar JSON is this annotation. global.logAsJson on the Helm
        # release only covers the control plane. The two are independent.
        dapr.io/log-as-json: "true"
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=ok"]
          ports:
            - containerPort: 8080

        - name: driver
          image: curlimages/curl:8.11.1
          command: ["sh", "-c"]
          args:
            - |
              T=00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
              sleep 20
              while true; do
                for i in 1 2 3 4 5; do
                  curl -s -o /dev/null -H "traceparent: $T" \
                    http://127.0.0.1:3500/v1.0/invoke/logtest/method/ping
                  curl -s -o /dev/null -H "traceparent: $T" \
                    http://127.0.0.1:3500/v1.0/invoke/nosuchapp/method/x
                  curl -s -o /dev/null \
                    http://127.0.0.1:3500/v1.0/state/nostore/key1
                  curl -s -o /dev/null -X POST -d '{"a":1}' \
                    http://127.0.0.1:3500/v1.0/publish/nopubsub/t1
                  curl -s -o /dev/null \
                    http://127.0.0.1:3500/v1.0/metadata
                done
                sleep 5
              done
